<title>Traffic Offences</title>

<style>
:root{--bg:#f2f3f7;--card:#fff;--txt:#14161c;--mut:#6b7080;--line:#e3e5ec;--acc:#1b4fd8;--accbg:#e8eefc;--pts:#fff3e0;--ptst:#b45309;--fine:#0f7a4a;--fineb:#e3f6ec;

@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#1a1d26;--txt:#f1f2f6;--mut:#9aa0b3;--line:#2a2e3b;--acc:#7da2ff;--accbg:#232d4d;--pts:#3b2a10;--ptst:#fbbf5c;--fine:#5fe0a1;--fineb:#12301f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:28px;margin:0 0 10px;letter-spacing:-.5px}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0;margin-top:2px}
.search{position:relative}
.search input{width:100%;font-size:17px;padding:12px 38px 12px 40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;stroke:var(--mut)}
#clr{position:absolute;right:8px;top:8px;border:0;background:var(--line);color:var(--mut);width:24px;height:24px;border-radius:50%;font-size:14px;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 13px;border-radius:20px;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.meta{padding:6px 18px;font-size:13px;color:var(--mut)}
main{padding:0 16px 40px}
.grp{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.l{flex:1;min-width:0}
.rule{font-size:12px;font-weight:700;color:var(--acc);background:var(--accbg);display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:5px}
.desc{font-size:15px;line-height:1.35}
.r{text-align:right;flex:none}
.fine{font-size:17px;font-weight:700;color:var(--fine);background:var(--fineb);padding:3px 9px;border-radius:8px;display:inline-block}
.pts{font-size:12px;font-weight:600;color:var(--ptst);background:var(--pts);padding:3px 8px;border-radius:8px;display:inline-block;margin-top:6px}
.dbl{font-size:11px;color:var(--mut);margin-top:4px}
mark{background:#ffe27a;color:#000;border-radius:3px}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
footer{font-size:11px;color:var(--mut);text-align:center;padding:0 24px 30px;line-height:1.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--txt);font:inherit;display:flex;flex-direction:column;gap:6px;min-height:96px;justify-content:space-between}
.tile:active{background:var(--accbg)}
.tile .ic{width:40px;height:40px;border-radius:11px;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center}.tile .ic svg{width:22px;height:22px}
.tile .nm{font-size:15px;font-weight:600;line-height:1.2}
.tile .n{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;padding-top:10px}
.bar:empty{display:none}
.back{border:0;background:var(--accbg);color:var(--acc);font:inherit;font-weight:600;font-size:15px;padding:7px 12px;border-radius:18px}
.ct{font-weight:700;font-size:16px}
.code{font-size:12px;color:var(--mut);margin-top:7px}.code b{color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:.3px;font-size:13px}.code i{color:var(--ptst);font-style:normal;font-weight:600;margin-left:4px}
</style>
</head>
